[package]
name = "http3"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["HTTP/3 Implementation Team"]
description = "A production-grade HTTP/3 implementation in Rust"
repository = "https://github.com/your-org/http3"
license = "MIT OR Apache-2.0"
categories = ["network-programming", "web-programming"]
keywords = ["http3", "quic", "networking", "protocol"]

[lib]
name = "http3"
crate-type = ["lib"]

[features]
default = ["tls-rustls", "logging", "async-tokio"]
tls-rustls = ["dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots", "dep:rcgen", "dep:rustls-native-certs", "dep:rustls-pemfile"]
logging = ["dep:tracing"]
testing = ["dep:proptest"]
json = []
async-tokio = ["dep:tokio"]
trace = []

[dependencies]
tokio = { version = "1.46.1", features = ["net", "rt", "rt-multi-thread", "time", "sync", "macros", "fs"], optional = true }
bytes = "1.10.1"
thiserror = "2.0.12"
bitflags = "2.9.1"
smallvec = "1.15.1"
ahash = "0.8.12"
parking_lot = "0.12.4"
pin-project-lite = "0.2.16"

# Cryptography
ring = "0.17.14"
getrandom = "0.3.3"
rustls = { version = "0.23.29", optional = true }
rustls-pki-types = { version = "1.12.0", optional = true }
webpki-roots = { version = "1.0.1", optional = true }
rcgen = { version = "0.14.2", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
rustls-pemfile = { version = "2.0", optional = true }

# Networking
socket2 = { version = "0.5.10", features = ["all"] }
url = "2.5.4"
async-trait = "0.1.88"
mime_guess = "2.0.5"

# Logging (optional)
tracing = { version = "0.1.41", optional = true }
log = "0.4"

# No external dependencies for WhatHappened - std only

# JSON support
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

# Testing (optional)
proptest = { version = "1.7.0", optional = true }

[dev-dependencies]
tokio-test = "0.4.4"
tracing-subscriber = "0.3"
criterion = "0.6.0"
proptest = "1.7.0"
futures = "0.3"


[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = true
overflow-checks = true

[profile.test]
debug = true

[[bench]]
name = "whathappened_bench"
harness = false
